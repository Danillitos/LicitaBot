name: Build Windows

# Manual (aba Actions -> Run workflow) ou automático no push para main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 de propósito: pandas==2.2.2 e outras deps fixadas ainda não publicam
          # wheel para 3.13+, e sem wheel o runner tentaria compilar do zero.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requeriments.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requeriments.txt
          pip install pyinstaller==6.20.0

      - name: Build
        run: pyinstaller --clean --noconfirm LicitaBot.spec

      - name: Conferir que o executável saiu
        shell: pwsh
        run: |
          Get-ChildItem dist
          if (-not (Test-Path dist\LicitaBot.exe)) {
            throw "dist\LicitaBot.exe não foi gerado — veja o log do PyInstaller acima"
          }
          $mb = [math]::Round((Get-Item dist\LicitaBot.exe).Length / 1MB, 1)
          Write-Host "LicitaBot.exe gerado: $mb MB"

      - uses: actions/upload-artifact@v4
        with:
          name: LicitaBot-windows
          path: dist/LicitaBot.exe
          retention-days: 90
